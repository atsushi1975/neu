<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>ノイ | ルーム</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body class="room" data-room-id="{{ room_id }}">
  <header class="topbar">
    <a href="/" class="brand">ノイ</a>
    <div class="room-id">
      <span class="room-id-text">ルーム <code id="room-id-label">{{ room_id }}</code></span>
      <button id="copy-room" type="button" class="ghost small">コピー</button>
      <button id="leave-room" type="button" class="ghost small">退出</button>
    </div>
  </header>

  <p id="error" class="error" role="alert"></p>

  <main id="join-panel" class="panel" hidden>
    <h2>このルームに参加</h2>
    <p class="muted">名前を入れて参加してください。</p>
    <form id="join-form" class="stack">
      <label>名前
        <input id="join-name" maxlength="16" required autocomplete="nickname">
      </label>
      <button type="submit" class="primary">参加する</button>
    </form>
  </main>

  <main id="lobby-panel" class="panel" hidden>
    <h2 id="lobby-title">ロビー</h2>
    <p id="lobby-game" class="muted"></p>
    <p id="lobby-host" class="muted"></p>
    <p id="lobby-rule" class="muted"></p>
    <ul id="lobby-players" class="player-list"></ul>
    <p id="lobby-status" class="lobby-status" role="status" aria-live="polite"></p>
    <div class="lobby-actions">
      <div id="start-wrap" class="start-wrap" hidden>
        <button id="start-button" type="button" class="primary">ゲームを開始</button>
      </div>
      <button id="take-host" type="button" class="ghost small" hidden>ホストを引き継ぐ</button>
    </div>
  </main>

  <main id="game-panel" hidden>
    <section class="summary" aria-label="場の状況">
      <div class="summary-top">
        <span id="summary-round" class="summary-chip">ラウンド 1</span>
        <span id="summary-direction" class="summary-chip">↻ 時計回り</span>
        <span id="summary-remaining" class="summary-chip">1枚</span>
      </div>
      <p class="summary-label">場の合計</p>
      <p id="summary-sum" class="summary-sum">0</p>
      <p id="summary-note" class="summary-note"></p>
    </section>

    <section id="table" class="table" aria-label="プレイヤー">
      <div id="table-center" class="table-center">
        <p id="table-sum" class="table-sum">0</p>
        <div id="table-pile" class="pile">
          <div id="table-card" class="pile-card"></div>
          <p id="table-count" class="pile-count"></p>
        </div>
        <div id="table-deck" class="pile">
          <div class="deck-back"></div>
          <p id="deck-count" class="deck-count"></p>
        </div>
      </div>
      <div id="players" class="table-seats" aria-label="プレイヤー"></div>
      <div id="turn-arrow" class="turn-arrow" aria-hidden="true">
        <svg id="turn-arc" class="turn-arc" viewBox="0 0 120 120">
          <circle class="turn-track" cx="60" cy="60" r="40"></circle>
          <g class="turn-hand">
            <line x1="60" y1="60" x2="60" y2="22"></line>
            <path d="M60,22 L50,38 L70,38 Z"></path>
          </g>
        </svg>
      </div>
    </section>

    <div id="prompt" class="prompt" role="status" aria-live="polite"></div>

    <section class="hand-wrap">
      <h3>自分の手札 <span id="hand-count" class="muted"></span></h3>
      <div id="hand" class="hand"></div>
      <p id="hand-help" class="hand-help">カードをタップして出せます。</p>
      <div id="cancel-shot-wrap" class="naming-bar" hidden>
        <button id="cancel-shot" type="button" class="ghost small">やめる</button>
      </div>
    </section>

    <section class="log-wrap">
      <div class="log-header">
        <h3>ログ</h3>
        <button id="log-toggle" type="button" class="ghost small">▾</button>
      </div>
      <ol id="log" class="log"></ol>
    </section>
  </main>

  <div id="last-round-toast" class="toast" role="status" aria-live="assertive" hidden>
    <p id="toast-title" class="toast-title"></p>
    <p id="toast-body" class="toast-body"></p>
    <div id="toast-hand" class="toast-hand"></div>
  </div>

  <div id="result-overlay" class="overlay" hidden>
    <div class="result-card">
      <p class="result-eyebrow">ゲーム終了</p>
      <h2 id="result-winner">勝者</h2>
      <p id="result-message" class="result-message"></p>
      <ol id="result-standings" class="result-standings"></ol>
      <a href="/" class="button primary">新しいルームを作る</a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='table-layout.js') }}"></script>
  <script src="{{ url_for('static', filename='room.js') }}"></script>
</body>
</html>
